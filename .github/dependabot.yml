version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
      
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Bundle all NuGet updates into a single pull request instead of
    # opening a separate PR per package.
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    # The next major of the .NET packages (Microsoft.Extensions.* 12.0.0) belongs to the next .NET: it comes with the
    # change of the target framework, not alone.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]

  # The SDK of global.json: patch and feature bands as they are released; the next major (11 to 12) comes with the
  # change of the target framework, never alone.
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The .NET images move to the next major with the target framework, as the SDK does. They come from build
    # arguments in the Dockerfile (BASE_SDK, BASE_RUNTIME_IMAGE, BASE_RUNTIME_TAG).
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
