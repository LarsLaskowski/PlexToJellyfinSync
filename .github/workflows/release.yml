name: Release

# The maintainer creates the release and its tag on GitHub and publishes it as a pre-release; this workflow
# checks the tagged commit, builds and pushes the Docker image, and only then turns the pre-release into the
# latest full release (decision 0026).
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

# Single source for the published image name; the README documents the same one.
# DOCKERHUB_USERNAME stays a secret and is only used for the registry login.
env:
  IMAGE_NAME: networlddev/plextojellyfinsync

jobs:
  docker:
    name: Check tag and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Warn about a release published without the pre-release step
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          printf '::warning::Release %s was published as a full release, before the image was built; publish releases as a pre-release so the workflow promotes them once the image is pushed.\n' "$TAG"

      - name: Check tag format
        env:
          TAG: ${{ github.ref_name }}
          LC_ALL: C
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::Tag %s is not a release tag; expected vMAJOR.MINOR.PATCH, for example v1.2.3.\n' "'$TAG'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            printf '::error::Tag %s points to a commit that is not on main; releases are cut from main only.\n' "$TAG"
            exit 1
          fi

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote:
    name: Promote to full release
    needs: docker
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag still points to the built commit
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha)"
          if [[ $current != "$GITHUB_SHA" ]]; then
            printf '::error::Tag %s no longer points to the built commit %s; it was moved during the run. Delete the release and its tag, then create the release again.\n' "$TAG" "$GITHUB_SHA"
            exit 1
          fi

      - name: Check release is still a pre-release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [[ $prerelease != true ]]; then
            printf '::error::Release %s is no longer a pre-release; it was changed during the run, so the workflow leaves it as it is.\n' "$TAG"
            exit 1
          fi

      - name: Promote to latest full release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

  # Triggers a rebuild of www.e-networld.de once the release is public. Requires the repository secret
  # WEBSITE_DISPATCH_TOKEN (fine-grained token, repository access limited to LarsLaskowski/e-networld,
  # permission "Contents: Read and write").
  notify:
    name: Notify website
    needs: [docker, promote]
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.promote.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: LarsLaskowski/e-networld
          event-type: release
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}'