name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PlexToJellyfinSync.slnx

      - name: Format check
        run: |
          dotnet tool install -g Reihitsu.Cli
          export PATH="$PATH:$HOME/.dotnet/tools"
          reihitsu-format ./
          git diff --exit-code

      - name: Build
        run: dotnet build PlexToJellyfinSync.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PlexToJellyfinSync.slnx -c Release --no-build
